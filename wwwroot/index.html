<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="lib/sortablejs/Sortable.min.js"></script>
    <script src="lib/html2pdf/html2pdf.bundle.min.js"></script>
    <script src="lib/pdfmake/build/pdfmake.min.js"></script>
    <script src="lib/pdfmake/build/vfs_fonts.js"></script>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        (async function () {
            if (!('serviceWorker' in navigator)) return;

            // Read the deployment build id stamped into the service worker by the
            // deploy workflow (// build:<run_id>). Fetching with cache:'no-store'
            // bypasses all caches so we always see the latest deployment.
            let buildId = '';
            try {
                const swText = await fetch('service-worker.js', { cache: 'no-store' }).then(r => r.text());
                const m = swText.match(/\/\/\s*build:(\S+)/);
                if (m) buildId = m[1];
            } catch (e) { }

            const stored = localStorage.getItem('sw-build');

            if (buildId && stored && stored !== buildId) {
                // A new deployment is live: wipe the old service worker and caches,
                // then reload so the page re-registers cleanly against the new build.
                try {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(r => r.unregister()));
                    const keys = await caches.keys();
                    await Promise.all(keys.map(k => caches.delete(k)));
                } catch (e) { }
                localStorage.setItem('sw-build', buildId);
                window.location.reload();
                return;
            }
            if (buildId) localStorage.setItem('sw-build', buildId);

            // Register (or keep) the service worker. The ?v= query busts any HTTP
            // cache of the script, and updateViaCache:'none' keeps update checks fresh.
            const reg = await navigator.serviceWorker.register(
                'service-worker.js' + (buildId ? '?v=' + buildId : ''),
                { updateViaCache: 'none' });
            reg.update();
        })();
    </script>
</body>
